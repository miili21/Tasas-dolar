name: Actualizar tasas del dólar en Notion

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (hora UTC)
  workflow_dispatch:          # botón para ejecutarlo a mano

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar tarjetas
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ee5ea6693bf782bf8ebb81005b84ae28
        run: python actualizar_tasas.py
